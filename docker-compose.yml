services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "14330:1433"
    volumes:
      - cafe_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CafeDatabase: "Server=db,1433;Database=CafeManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Seed__Enabled: "true"
      Seed__Passwords__admin: ${SEED_ADMIN_PASSWORD:?Set seed passwords in .env}
      Seed__Passwords__manager: ${SEED_MANAGER_PASSWORD:?Set seed passwords in .env}
      Seed__Passwords__waiter: ${SEED_WAITER_PASSWORD:?Set seed passwords in .env}
      Seed__Passwords__barista: ${SEED_BARISTA_PASSWORD:?Set seed passwords in .env}
      Seed__Passwords__cashier: ${SEED_CASHIER_PASSWORD:?Set seed passwords in .env}
      Seed__Passwords__warehouse: ${SEED_WAREHOUSE_PASSWORD:?Set seed passwords in .env}
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend/cafe-management-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  cafe_sql_data:
